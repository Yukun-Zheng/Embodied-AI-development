name: Executable textbook regression

on:
  push:
    paths:
      - "code/minimal/**"
      - "labs/runnable/**"
      - "labs/simulators/**"
      - ".github/workflows/minimal-code-regression.yml"
  pull_request:
    paths:
      - "code/minimal/**"
      - "labs/runnable/**"
      - "labs/simulators/**"
      - ".github/workflows/minimal-code-regression.yml"

jobs:
  executable-textbook:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r labs/simulators/mujoco/requirements.txt

      - name: Run all minimal examples
        run: python code/minimal/run_all.py

      - name: Run executable mechanism lab smoke tests
        run: |
          python labs/runnable/run_smoke.py
          python labs/runnable/lab25_visual_intervention/smoke.py
          python labs/runnable/lab26_cross_embodiment/smoke.py
          python labs/runnable/lab27_long_horizon_memory/smoke.py
          python labs/runnable/lab31_reasoning_negative_control/smoke.py
          python labs/runnable/lab32_experience_learning_flywheel/smoke.py
          python labs/runnable/lab33_continual_learning/smoke.py
          python labs/runnable/lab34_self_generated_curriculum/smoke.py
          python labs/runnable/lab37_bimanual_coordination/smoke.py
          python labs/runnable/lab38_multi_robot_collaboration/smoke.py
          python labs/runnable/lab40_safety_shield/smoke.py

      - name: Run lightweight simulator-layer smoke tests
        run: |
          python labs/simulators/mujoco/lab04_smoke.py
          python labs/simulators/mujoco/lab05_smoke.py
          python labs/simulators/mujoco/smoke.py
