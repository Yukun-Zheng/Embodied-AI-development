name: Minimal textbook code regression

on:
  push:
    paths:
      - "code/minimal/**"
      - ".github/workflows/minimal-code-regression.yml"
  pull_request:
    paths:
      - "code/minimal/**"
      - ".github/workflows/minimal-code-regression.yml"

jobs:
  minimal-code:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run all minimal examples
        run: python code/minimal/run_all.py
