name: Sync README Publication Status

on:
  push:
    branches: [main]
    paths:
      - "scripts/sync_readme_publication_status.py"
      - ".github/workflows/sync-readme-publication-status.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Synchronize publication status
        run: python scripts/sync_readme_publication_status.py

      - name: Validate manuscript quality gates
        run: |
          python scripts/validate_book.py
          python scripts/audit_chapters.py
          python scripts/audit_claim_evidence.py

      - name: Commit README status when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "README publication status is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Synchronize README publication-quality status"
          git pull --rebase origin main
          git push origin HEAD:main
