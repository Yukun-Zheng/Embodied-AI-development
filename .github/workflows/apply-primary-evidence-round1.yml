name: Apply Local Primary Evidence Round 1

on:
  push:
    branches: [main]
    paths:
      - "scripts/apply_primary_evidence_round1.py"
      - ".github/workflows/apply-primary-evidence-round1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add subsection-level primary evidence
        run: python scripts/apply_primary_evidence_round1.py

      - name: Regenerate chapter-driven TOC
        run: python scripts/generate_toc.py

      - name: Validate manuscript and evidence audit
        run: |
          python scripts/validate_book.py
          python scripts/audit_chapters.py
          python scripts/audit_claim_evidence.py

      - name: Commit local evidence when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- book/chapters/24-vla-second-stage-2024-2026.md book/TOC.md; then
            echo "Part 24 primary evidence is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book/chapters/24-vla-second-stage-2024-2026.md book/TOC.md
          git commit -m "Add local primary evidence to Part 24"
          git pull --rebase origin main
          git push origin HEAD:main
