name: Textbook Website Build

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "BOOK_PLAN.md"
      - "AUTHORING_GUIDE.md"
      - "book/**"
      - "figures/**"
      - "labs/**"
      - "references/**"
      - "case-studies/**"
      - "code/**"
      - "docs-assets/**"
      - "scripts/prepare_site.py"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/site-build.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install documentation toolchain
        run: pip install -r requirements-docs.txt

      - name: Prepare publication source tree and chapter-driven navigation
        run: python scripts/prepare_site.py

      - name: Build MkDocs site
        run: mkdocs build -f .site-mkdocs.yml --clean

      - name: Check key generated pages
        shell: bash
        run: |
          set -euo pipefail
          test -f .site-mkdocs.yml
          test -f .site-build/index.html
          test -f .site-build/book/TOC/index.html
          test -f .site-build/book/RESEARCH_CROSSWALK/index.html
          test -f .site-build/book/MAINTENANCE/index.html
          test -f .site-build/book/chapters/00-what-is-embodied-intelligence/index.html
          test -f .site-build/book/chapters/24-vla-second-stage-2024-2026/index.html
          test -f .site-build/book/chapters/50-from-learner-to-independent-researcher/index.html
          test -f .site-build/case-studies/ACT_SOURCE_WALKTHROUGH/index.html
          test -f .site-build/case-studies/OPENVLA_SOURCE_WALKTHROUGH/index.html
          test -f .site-build/case-studies/GR00T_N17_SOURCE_WALKTHROUGH/index.html
          test -f .site-build/case-studies/VJEPA2_1_SOURCE_WALKTHROUGH/index.html
          test -f .site-build/case-studies/WORLD_MODEL_CONTROL/index.html
          test -f .site-build/references/CHAPTER_SOURCE_ANCHORS/index.html
          test -f .site-build/references/SOURCE_CODE_ATLAS/index.html
          test -f .site-build/labs/index.html
          test -f .site-build/labs/EXECUTION_MATRIX/index.html
          test -f .site-build/labs/runnable/index.html
          test -f .site-build/labs/runnable/lab13_active_perception/index.html
          test -f .site-build/labs/runnable/lab13_active_perception/REFERENCE_RESULTS/index.html
          test -f .site-build/labs/runnable/lab14_tactile_reflex/index.html
          test -f .site-build/labs/runnable/lab14_tactile_reflex/REFERENCE_RESULTS/index.html
          test -f .site-build/labs/runnable/lab22_async_execution/index.html
          test -f .site-build/labs/runnable/lab25_visual_intervention/index.html
          test -f .site-build/labs/runnable/lab25_visual_intervention/REFERENCE_RESULTS/index.html
          test -f .site-build/labs/runnable/lab26_cross_embodiment/index.html
          test -f .site-build/labs/runnable/lab26_cross_embodiment/REFERENCE_RESULTS/index.html
          test -f .site-build/labs/runnable/lab27_long_horizon_memory/index.html
          test -f .site-build/labs/runnable/lab27_long_horizon_memory/REFERENCE_RESULTS/index.html
          test -f .site-build/labs/runnable/lab29_world_model_mpc/index.html
          test -f .site-build/labs/runnable/lab29_world_model_mpc/REFERENCE_RESULTS/index.html
          test -f .site-build/labs/runnable/lab31_reasoning_negative_control/index.html
          test -f .site-build/labs/runnable/lab31_reasoning_negative_control/REFERENCE_RESULTS/index.html
          test -f .site-build/labs/runnable/lab32_experience_learning_flywheel/index.html
          test -f .site-build/labs/runnable/lab32_experience_learning_flywheel/REFERENCE_RESULTS/index.html
          test -f .site-build/labs/runnable/lab33_continual_learning/index.html
          test -f .site-build/labs/runnable/lab33_continual_learning/REFERENCE_RESULTS/index.html
          test -f .site-build/labs/runnable/lab34_self_generated_curriculum/index.html
          test -f .site-build/labs/runnable/lab34_self_generated_curriculum/REFERENCE_RESULTS/index.html
          test -f .site-build/labs/runnable/lab37_bimanual_coordination/index.html
          test -f .site-build/labs/runnable/lab37_bimanual_coordination/REFERENCE_RESULTS/index.html
          test -f .site-build/labs/runnable/lab38_multi_robot_collaboration/index.html
          test -f .site-build/labs/runnable/lab38_multi_robot_collaboration/REFERENCE_RESULTS/index.html
          test -f .site-build/labs/runnable/lab40_safety_shield/index.html
          test -f .site-build/labs/runnable/lab40_safety_shield/REFERENCE_RESULTS/index.html
          grep -q 'Part 24' .site-mkdocs.yml
          grep -q 'Research Crosswalk' .site-mkdocs.yml
          grep -q '51-Part Primary Sources' .site-mkdocs.yml
          grep -q 'GR00T N1.7' .site-mkdocs.yml
          grep -q 'Execution Matrix' .site-mkdocs.yml
          grep -q 'Lab 13 · Active Perception' .site-mkdocs.yml
          grep -q 'Lab 14 · Tactile Reflex' .site-mkdocs.yml
          grep -q 'Lab 22 · Async Execution' .site-mkdocs.yml
          grep -q 'Lab 25 · Visual Intervention' .site-mkdocs.yml
          grep -q 'Lab 25 · Reference Results' .site-mkdocs.yml
          grep -q 'Lab 26 · Cross-Embodiment' .site-mkdocs.yml
          grep -q 'Lab 27 · Long-Horizon Memory' .site-mkdocs.yml
          grep -q 'Lab 27 · Reference Results' .site-mkdocs.yml
          grep -q 'Lab 29 · World Model MPC' .site-mkdocs.yml
          grep -q 'Lab 31 · Reasoning Negative Control' .site-mkdocs.yml
          grep -q 'Lab 32 · Experience Learning Flywheel' .site-mkdocs.yml
          grep -q 'Lab 32 · Reference Results' .site-mkdocs.yml
          grep -q 'Lab 33 · Continual Learning' .site-mkdocs.yml
          grep -q 'Lab 34 · Self-Generated Curriculum' .site-mkdocs.yml
          grep -q 'Lab 34 · Reference Results' .site-mkdocs.yml
          grep -q 'Lab 37 · Bimanual Coordination' .site-mkdocs.yml
          grep -q 'Lab 37 · Reference Results' .site-mkdocs.yml
          grep -q 'Lab 38 · Multi-Robot Collaboration' .site-mkdocs.yml
          grep -q 'Lab 38 · Reference Results' .site-mkdocs.yml
          grep -q 'Lab 40 · Safety Shield' .site-mkdocs.yml
          grep -q 'Lab 40 · Reference Results' .site-mkdocs.yml
          echo "Website build, research/evidence entry points and executable lab pages smoke test passed."

      - uses: actions/upload-artifact@v4
        with:
          name: embodied-ai-textbook-site
          path: .site-build/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
