name: Textbook QA

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "BOOK_PLAN.md"
      - "AUTHORING_GUIDE.md"
      - "book/**"
      - "figures/**"
      - "labs/**"
      - "references/**"
      - "case-studies/**"
      - "code/**"
      - "scripts/generate_toc.py"
      - "scripts/validate_book.py"
      - "scripts/audit_chapters.py"
      - ".github/workflows/book-qa.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate manuscript structure, links and generated TOC
        run: python scripts/validate_book.py

      - name: Report chapter depth and source coverage
        run: python scripts/audit_chapters.py
